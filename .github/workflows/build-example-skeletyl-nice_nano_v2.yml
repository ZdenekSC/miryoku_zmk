name: 'Build Example Skeletyl Nice Nano v2'
on:
  workflow_dispatch:
jobs:
  main:
    uses: ./.github/workflows/main.yml
    with:
      board: '["nice_nano_v2"]'
      shield: '["skeletyl_left","skeletyl_right"]'
      alphas: '["default"]'
      nav: '["default"]'
      layers: '["default"]'
      mapping: '["default"]'
      custom_config: '["default"]'
      kconfig: '["CONFIG_ZMK_BLE=y","CONFIG_BT_CTLR_TX_PWR_PLUS_8=y","CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16","CONFIG_ZMK_POINTING=y"]'
      branches: '["default"]'
      modules: '["default"]'