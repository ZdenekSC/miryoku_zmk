# Bluetooth Configuration for better connectivity
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Increase BT transmission power for better range
CONFIG_BT_CTLR_TX_PWR_0=y

# Enable more BT profiles for better compatibility
CONFIG_ZMK_SPLIT_BLE=y

# Increase combo count for key emulation combos
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16

# Sleep settings for power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# HID settings for better compatibility
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Reset behavior for connection issues
CONFIG_ZMK_SETTINGS_RESET_ON_START=n

# Mouse keys support
CONFIG_ZMK_POINTING=y